aid: prime-hydration
name: Prime Hydration
description: >-
  Prime Hydration, LLC is an American beverage company founded in 2022 by Logan Paul and Olajide
  "KSI" Olatunji, manufacturing sports and hydration drinks, zero-sugar hydration, energy drinks,
  hydration sticks and protein shakes sold direct-to-consumer at drinkprime.com and through
  retail distribution across North America, Europe, Australia and the Middle East. Prime is not a
  software company and publishes no developer program, SDK or REST API. Its machine-readable
  surface is its own storefront: the drinkprime.com store implements the Universal Commerce
  Protocol (UCP) natively on Shopify, publishing a UCP merchant profile at /.well-known/ucp, an
  anonymous MCP endpoint at /api/ucp/mcp exposing thirteen catalog, cart, checkout and order
  tools, an agent-instruction document at /agents.md mirrored to /llms.txt, and Shopify Customer
  Accounts OAuth 2.0 / OpenID Connect metadata. Agent-driven purchase is explicitly permitted;
  agent-completed payment without contemporaneous buyer approval is explicitly forbidden.
