apis:
- name: PRIME Storefront Agentic Commerce API (UCP / MCP)
  description: >-
    The agent-facing commerce surface of the PRIME online store. Served from drinkprime.com, it
    implements the Universal Commerce Protocol (UCP) shopping service over MCP transport: a
    discovery document at /.well-known/ucp declaring supported UCP versions, services,
    capabilities and payment handlers, and a JSON-RPC MCP endpoint at /api/ucp/mcp that answers
    tools/list anonymously with thirteen tools covering catalog search and lookup, product
    retrieval, cart create/read/update/cancel, and checkout create/read/update/complete/cancel
    plus order retrieval. complete_checkout requires an idempotency key and buyer approval.
  humanURL: https://drinkprime.com/agents.md
  baseURL: https://drinkprime.com/api/ucp/mcp
